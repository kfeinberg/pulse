name: Functions checks
on:
  pull_request:
    paths: ['functions/**', 'firebase.json', 'firestore.indexes.json', '.github/workflows/functions.yml']
  push:
    branches: [main, staged-pipeline]
    paths: ['functions/**', 'firebase.json', 'firestore.indexes.json', '.github/workflows/functions.yml']
permissions:
  contents: read
concurrency:
  group: functions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: functions
      - run: npm test
        working-directory: functions
        env:
          GCLOUD_PROJECT: demo-pulse-test
